name: Notion GraphRAG Task Loop

on:
  schedule:
    - cron: "7/20 * * * *"
  workflow_dispatch:
    inputs:
      max_iterations:
        description: "Max Codex turns for the selected Notion task"
        required: false
        default: "5"
      dry_run:
        description: "Only write a dry-run result to Notion"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notion-graph-rag-loop
  cancel-in-progress: false

jobs:
  run-one-task:
    name: Run one GraphRAG Notion task
    runs-on: [self-hosted, ralph]
    timeout-minutes: 90

    env:
      NOTION_GRAPH_RAG_PAGE_URL: "https://app.notion.com/p/aice-co-jp/GraphRAG-344e00135b61800e94f6c24a011d522c"
      NOTION_OAUTH_ACCESS_TOKEN: ${{ secrets.NOTION_OAUTH_ACCESS_TOKEN }}
      MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || '5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup local tool paths
        run: |
          echo "$HOME/.local/node-v24.13.0/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - name: Check runner prerequisites
        run: |
          test -n "$NOTION_OAUTH_ACCESS_TOKEN"
          command -v python3
          command -v node
          command -v npm
          command -v codex

      - name: Install dependencies
        run: npm ci

      - name: Run next Notion task
        run: |
          args=(
            "$NOTION_GRAPH_RAG_PAGE_URL"
            --limit 1
            --priority-sort
            --max-iterations "$MAX_ITERATIONS"
          )
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            args+=(--dry-run)
          fi
          ./scripts/shell-loop-notion.sh "${args[@]}"
