name: Scheduled Loop Check

on:
  schedule:
    - cron: "17 9 * * 1-5"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-loop-check
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck and loop readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Loop readiness audit
        id: loop_audit
        continue-on-error: true
        run: |
          npm run loop:audit | tee loop-audit.txt
          {
            echo "## Loop readiness audit"
            echo
            echo '```text'
            cat loop-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Loop cost estimate
        run: |
          npm run loop:cost | tee loop-cost.txt
          {
            echo
            echo "## Loop cost estimate"
            echo
            echo '```text'
            cat loop-cost.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
